version: "3"

silent: true

tasks:
  backend:dev:
    desc: Run backend development server
    dir: backend
    cmds:
      - go run main.go

  backend:fmt:check:
    desc: Verify backend Go formatting
    dir: backend
    cmds:
      - |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

  backend:fmt:fix:
    desc: Format backend Go files with gofmt
    dir: backend
    cmds:
      - gofmt -w .

  backend:vet:
    desc: Run backend go vet checks
    dir: backend
    cmds:
      - go vet ./...

  backend:lint:
    desc: Run backend golangci-lint checks
    dir: backend
    cmds:
      - go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run --config .golangci.yml ./...

  backend:test:
    desc: Run backend tests
    dir: backend
    cmds:
      - go test ./...

  backend:build:
    desc: Build backend binary
    dir: backend
    cmds:
      - mkdir -p bin
      - go build -o bin/minedock-backend{{.EXE_EXT}} .

  frontend:dev:
    desc: Run frontend development server
    dir: frontend
    cmds:
      - npm run dev

  frontend:install:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - npm install

  frontend:build:
    desc: Build frontend assets
    dir: frontend
    cmds:
      - npm run build

  frontend:lint:
    desc: Run frontend ESLint checks
    dir: frontend
    cmds:
      - npm run lint

  frontend:fmt:check:
    desc: Run frontend Prettier format checks
    dir: frontend
    cmds:
      - npm run format:check

  frontend:fmt:fix:
    desc: Format frontend files with Prettier
    dir: frontend
    cmds:
      - npm run format

  docs:todo:
    desc: Generate docs/exec-plans/TODO.md from TODO comments
    cmds:
      - go run ./scripts/todo-gen/main.go -root . -out ./docs/exec-plans/TODO.md

  docs:lint:rules:
    desc: Run Markdown rule checks for the knowledge base
    cmds:
      - npx --yes markdownlint-cli2 "AGENTS.md" "Readme.md" "docs/**/*.md"

  docs:lint:rules:fix:
    desc: Auto-fix Markdown rule violations where possible
    cmds:
      - npx --yes markdownlint-cli2 --fix "AGENTS.md" "Readme.md" "docs/**/*.md"

  docs:links:check:
    desc: Check Markdown links for the knowledge base
    cmds:
      - npx --yes markdown-link-check -q "AGENTS.md" "Readme.md" "docs"

  docs:lint:
    desc: Run documentation lint checks
    deps:
      - docs:lint:rules
      - docs:links:check

  docs:lint:fix:
    desc: Auto-fix documentation lint issues where possible
    deps:
      - docs:lint:rules:fix

  docs:fmt:check:
    desc: Run Markdown formatting checks
    cmds:
      - npx --yes prettier --check "AGENTS.md" "Readme.md" "docs/**/*.md"

  docs:fmt:fix:
    desc: Format Markdown documents with Prettier
    cmds:
      - npx --yes prettier --write "AGENTS.md" "Readme.md" "docs/**/*.md"

  dev:
    desc: Run backend and frontend dev servers in parallel
    deps:
      - backend:dev
      - frontend:dev

  build:
    desc: Build backend and frontend
    deps:
      - backend:build
      - frontend:build

  clean:
    desc: Clean backend and frontend build outputs
    cmds:
      - rm -rf backend/bin frontend/dist

  fmt:check:
    desc: Run global formatting checks
    deps:
      - backend:fmt:check
      - frontend:fmt:check
      - docs:fmt:check

  fmt:fix:
    desc: Run global formatting fixes
    deps:
      - backend:fmt:fix
      - frontend:fmt:fix
      - docs:fmt:fix

  lint:
    desc: Run global lint checks
    deps:
      - backend:lint
      - frontend:lint
      - docs:lint

  vet:
    desc: Run global vet checks
    deps:
      - backend:vet

  test:
    desc: Run global tests
    deps:
      - backend:test

  default:
    desc: Help
    cmds:
      - task --list